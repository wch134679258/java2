<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aurora · 星海入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#05060f;
  --ink:#eef2ff;
  --muted:#8d97bd;
  --a1:#7c5cff;
  --a2:#22d3ee;
  --a3:#ff5fa2;
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.11);
  --radius:24px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Outfit","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
  display:grid;
  place-items:center;
  position:relative;
}

/* ============ background ============ */
#bg{position:fixed;inset:0;z-index:0;display:block}
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.35'/></svg>");
  mix-blend-mode:overlay;
}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(3,4,12,.75) 100%);
}

/* ============ stage / card ============ */
.stage{position:relative;z-index:2;padding:24px;width:100%;display:grid;place-items:center}
.card{
  position:relative;
  width:min(1040px,100%);
  border-radius:var(--radius);
  overflow:hidden;
  transform-style:preserve-3d;
  transition:transform .5s var(--ease), box-shadow .5s var(--ease);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.06) inset;
  will-change:transform;
}
/* rotating conic border */
.card__spin{
  position:absolute;top:-60%;left:-60%;width:220%;height:220%;
  background:conic-gradient(from 0deg,transparent 0 55%,var(--a2) 66%,var(--a1) 74%,var(--a3) 82%,transparent 92% 100%);
  animation:spin 7s linear infinite;
  opacity:.85;
}
@keyframes spin{to{transform:rotate(1turn)}}
.card__fill{
  position:absolute;inset:1.5px;border-radius:calc(var(--radius) - 1px);
  background:
    linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 45%,rgba(255,255,255,.06)),
    rgba(10,12,26,.72);
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
}
/* cursor spotlight */
.card__spot{
  position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),rgba(124,92,255,.20),transparent 62%);
  opacity:0;transition:opacity .4s;
}
.card:hover .card__spot{opacity:1}
.card__inner{position:relative;display:grid;grid-template-columns:1.05fr 1fr;min-height:600px}

/* ============ brand panel ============ */
.brand{
  position:relative;padding:52px 46px;display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden;
}
.brand::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(70% 55% at 20% 15%,rgba(124,92,255,.34),transparent 70%),
    radial-gradient(60% 50% at 85% 80%,rgba(34,211,238,.26),transparent 70%);
}
.brand::after{
  content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,95,162,.30),transparent 65%);
  filter:blur(20px);animation:float 11s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(26px) scale(1.07)}}
.brand > *{position:relative;z-index:2}

.logo{display:flex;align-items:center;gap:12px}
.logo__mark{width:42px;height:42px;position:relative;display:grid;place-items:center}
.logo__mark i{position:absolute;inset:0;border-radius:13px;border:1.5px solid;border-color:transparent;
  background:conic-gradient(from 140deg,var(--a2),var(--a1),var(--a3),var(--a2)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 5s linear infinite;
}
.logo__mark b{width:11px;height:11px;border-radius:50%;background:linear-gradient(140deg,var(--a2),var(--a1));
  box-shadow:0 0 18px var(--a1)}
.logo span{font-weight:600;letter-spacing:.22em;font-size:14px;color:#cfd6ff}

.brand h1{
  font-size:clamp(34px,4.2vw,50px);line-height:1.1;font-weight:600;letter-spacing:-.02em;margin-top:auto;
}
.brand h1 em{
  font-style:normal;
  background:linear-gradient(100deg,var(--a2),var(--a1) 45%,var(--a3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:shine 6s linear infinite;
}
@keyframes shine{to{background-position:200% center}}
.brand p{color:var(--muted);margin-top:16px;font-size:15px;line-height:1.75;max-width:36ch;font-weight:300}

.stats{display:flex;gap:28px;margin-top:38px}
.stats div b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.stats div span{font-size:12px;color:var(--muted);letter-spacing:.06em}

/* ============ form panel ============ */
.panel{padding:52px 46px;display:flex;flex-direction:column;justify-content:center;position:relative}
.head{margin-bottom:26px}
.head h2{font-size:26px;font-weight:600;letter-spacing:-.01em}
.head p{color:var(--muted);font-size:14px;margin-top:8px;font-weight:300}
.head > *{transition:opacity .3s,transform .3s}
.head.swap > *{opacity:0;transform:translateY(-8px)}

/* tabs */
.tabs{position:relative;display:flex;gap:4px;padding:5px;background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);border-radius:14px;margin-bottom:26px}
.tabs i{position:absolute;top:5px;bottom:5px;border-radius:10px;
  background:linear-gradient(120deg,rgba(124,92,255,.95),rgba(34,211,238,.85));
  box-shadow:0 6px 18px -6px var(--a1);
  transition:left .45s var(--ease),width .45s var(--ease)}
.tab{position:relative;z-index:2;flex:1;border:0;background:none;color:var(--muted);
  font:inherit;font-size:14px;font-weight:500;padding:9px 0;border-radius:10px;cursor:pointer;
  transition:color .35s}
.tab.on{color:#fff}

#fields{display:grid;gap:14px;overflow:hidden;transition:height .45s var(--ease)}

/* field */
.field{position:relative;display:none}
.mode-login .field[data-for~="login"],
.mode-signup .field[data-for~="signup"],
.mode-reset .field[data-for~="reset"]{display:block;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.field .ico{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;
  color:var(--muted);transition:color .3s;pointer-events:none
}
.field input{
  width:100%;padding:24px 46px 11px 45px;
  background:var(--glass);border:1px solid var(--stroke);border-radius:15px;
  color:var(--ink);font:inherit;font-size:15px;outline:none;
  transition:border-color .3s,background .3s,box-shadow .3s;
}
.field input::placeholder{color:transparent}
.field label{
  position:absolute;left:45px;top:17px;font-size:14.5px;color:var(--muted);
  pointer-events:none;transition:.28s var(--ease);font-weight:300
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label{
  top:7px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--a2);
}
.field input:focus{border-color:rgba(124,92,255,.7);background:var(--glass-2);
  box-shadow:0 0 0 4px rgba(124,92,255,.13)}
.field:focus-within .ico{color:var(--a2)}
.field.invalid input{border-color:rgba(255,95,120,.75);box-shadow:0 0 0 4px rgba(255,95,120,.11);
  animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.err{display:none;margin:7px 0 0 4px;font-size:12px;color:#ff8098;letter-spacing:.02em}
.field.invalid .err{display:block}

.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;
  border-radius:9px;transition:color .25s,background .25s}
.eye:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.eye svg{width:18px;height:18px}

/* password strength */
.meter{margin-top:10px;display:none}
.mode-signup .meter{display:block}
.meter__bar{height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.meter__bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--a2),var(--a1));transition:width .4s var(--ease),background .4s}
.meter__txt{margin-top:6px;font-size:11.5px;color:var(--muted);letter-spacing:.05em}

/* row */
.row{display:none;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px}
.mode-login .row[data-for~="login"],
.mode-signup .row[data-for~="signup"],
.mode-reset .row[data-for~="reset"]{display:flex;animation:rise .5s var(--ease) both}
.check{display:flex;align-items:center;gap:9px;color:var(--muted);cursor:pointer;user-select:none}
.check input{display:none}
.box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--stroke);
  display:grid;place-items:center;transition:.25s var(--ease)}
.check input:checked + .box{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent}
.box svg{width:11px;height:11px;color:#fff;opacity:0;transform:scale(.4);transition:.25s var(--ease)}
.check input:checked + .box svg{opacity:1;transform:none}
.link{background:none;border:0;color:var(--a2);font:inherit;font-size:13px;cursor:pointer;
  padding:0;transition:opacity .25s,filter .25s}
.link:hover{filter:brightness(1.25)}

/* submit */
.submit{
  position:relative;margin-top:26px;width:100%;height:52px;border:0;border-radius:15px;
  font:inherit;font-size:15px;font-weight:600;letter-spacing:.02em;color:#fff;cursor:pointer;
  background:linear-gradient(115deg,var(--a1),#5b8bff 45%,var(--a2));
  background-size:180% auto;
  box-shadow:0 14px 34px -12px rgba(124,92,255,.85);
  overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s,background-position .6s;
  will-change:transform;
}
.submit:hover{background-position:right center;box-shadow:0 18px 42px -12px rgba(34,211,238,.7)}
.submit:active{transform:scale(.985)}
.submit[data-state="loading"]{pointer-events:none;color:transparent}
.submit[data-state="done"]{pointer-events:none;color:transparent;
  background:linear-gradient(115deg,#22c55e,#16a34a)}
.submit .txt{position:relative;z-index:3;transition:opacity .25s}
.spin{
  position:absolute;top:50%;left:50%;margin:-11px 0 0 -11px;width:22px;height:22px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.28);border-top-color:#fff;opacity:0;
  animation:rot .7s linear infinite;z-index:3;
}
@keyframes rot{to{transform:rotate(360deg)}}
.submit[data-state="loading"] .spin{opacity:1}
.submit[data-state="done"] .spin{opacity:0}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.42);transform:scale(0);
  animation:rip .65s var(--ease) forwards;pointer-events:none;z-index:2}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* divider + social */
.divider{display:flex;align-items:center;gap:14px;margin:26px 0 18px;color:var(--muted);font-size:11.5px;
  letter-spacing:.16em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
.social{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.social button{
  height:46px;display:grid;place-items:center;border-radius:13px;cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);color:var(--ink);
  transition:transform .3s var(--ease),background .3s,border-color .3s;
}
.social button:hover{transform:translateY(-3px);background:var(--glass-2);border-color:rgba(255,255,255,.22)}
.social svg{width:19px;height:19px}

/* success overlay */
.done{
  position:absolute;inset:0;z-index:9;border-radius:var(--radius);
  background:rgba(8,10,24,.9);backdrop-filter:blur(14px);
  display:grid;place-items:center;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;
}
.done.show{opacity:1;visibility:visible}
.done .inner{transform:translateY(14px);transition:transform .5s var(--ease) .1s}
.done.show .inner{transform:none}
.done h3{font-size:24px;font-weight:600;margin-top:18px}
.done p{color:var(--muted);font-size:14px;margin-top:8px}
.done .link{margin-top:22px;font-size:14px}
.checkmark{width:78px;height:78px}
.checkmark circle{stroke-dasharray:166;stroke-dashoffset:166;animation:draw .7s var(--ease) forwards}
.checkmark path{stroke-dasharray:48;stroke-dashoffset:48;animation:draw .45s var(--ease) .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* responsive */
@media (max-width:900px){
  .card__inner{grid-template-columns:1fr;min-height:0}
  .brand{padding:38px 30px 30px}
  .brand h1{margin-top:30px}
  .brand::after{display:none}
  .panel{padding:34px 30px 40px}
  .stats{gap:20px;margin-top:26px}
}
@media (max-width:480px){
  .stage{padding:12px}
  .brand{padding:30px 22px 22px}
  .panel{padding:28px 22px 34px}
  .tabs{margin-bottom:20px}
  .stats{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<main class="stage">
  <section class="card" id="card">
    <div class="card__spin"></div>
    <div class="card__fill"></div>
    <div class="card__spot" id="spot"></div>

    <div class="card__inner">
      <!-- ===== brand ===== -->
      <aside class="brand">
        <div class="logo">
          <div class="logo__mark"><i></i><b></b></div>
          <span>AURORA</span>
        </div>

        <div>
          <h1>进入你的<br><em>星海控制台</em></h1>
          <p>每一次登录，都是一次穿越极光的旅行。我们已为你点亮整片星空。</p>
          <div class="stats">
            <div><b>99.99%</b><span>服务可用性</span></div>
            <div><b>128</b><span>全球节点</span></div>
            <div><b>24h</b><span>极光守护</span></div>
          </div>
        </div>
      </aside>

      <!-- ===== form ===== -->
      <div class="panel mode-login" id="panel">
        <div class="head" id="head">
          <h2 id="title">欢迎回来</h2>
          <p id="subtitle">登录后继续你的探索之旅</p>
        </div>

        <div class="tabs" id="tabs">
          <i id="tabPill"></i>
          <button class="tab on" data-mode="login">登录</button>
          <button class="tab" data-mode="signup">注册</button>
        </div>

        <form id="form" novalidate>
          <div id="fields">
            <!-- name -->
            <div class="field" data-for="signup">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
              <input type="text" id="name" placeholder=" " autocomplete="name" />
              <label for="name">昵称</label>
              <span class="err">请输入至少 2 个字符</span>
            </div>

            <!-- email -->
            <div class="field" data-for="login signup reset">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7.5 8.5 5.5 8.5-5.5"/></svg>
              <input type="email" id="email" placeholder=" " autocomplete="email" />
              <label for="email">邮箱地址</label>
              <span class="err">请输入有效的邮箱地址</span>
            </div>

            <!-- password -->
            <div class="field" data-for="login signup">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" id="pass" placeholder=" " autocomplete="current-password" />
              <label for="pass">密码</label>
              <button type="button" class="eye" data-toggle="pass" aria-label="显示密码">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <span class="err">密码至少 8 位，且包含字母和数字</span>
              <div class="meter">
                <div class="meter__bar"><i id="mbar"></i></div>
                <div class="meter__txt" id="mtxt">密码强度：—</div>
              </div>
            </div>

            <!-- confirm -->
            <div class="field" data-for="signup">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="m9 15 2 2 4-4"/></svg>
              <input type="password" id="pass2" placeholder=" " autocomplete="new-password" />
              <label for="pass2">确认密码</label>
              <button type="button" class="eye" data-toggle="pass2" aria-label="显示密码">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <span class="err">两次输入的密码不一致</span>
            </div>
          </div>

          <!-- rows -->
          <div class="row" data-for="login">
            <label class="check">
              <input type="checkbox" id="remember" checked />
              <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></span>
              记住我
            </label>
            <button type="button" class="link" data-mode="reset">忘记密码？</button>
          </div>

          <div class="row" data-for="signup">
            <label class="check">
              <input type="checkbox" id="agree" />
              <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></span>
              同意服务条款
            </label>
            <button type="button" class="link" data-mode="login">已有账号</button>
          </div>

          <div class="row" data-for="reset">
            <span style="color:var(--muted)">我们将发送重置链接到你的邮箱</span>
            <button type="button" class="link" data-mode="login">返回登录</button>
          </div>

          <button class="submit" id="submit" type="submit">
            <span class="txt" id="submitTxt">登 录</span>
            <span class="spin"></span>
          </button>
        </form>

        <div class="divider">或使用以下方式</div>
        <div class="social">
          <button type="button" aria-label="GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2.2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.7 2.7 1.2 3.4.9.1-.7.4-1.2.7-1.5-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3 0 0 1-.3 3.3 1.2a11 11 0 0 1 6 0C18.1 4.5 19.1 4.8 19.1 4.8c.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>
          </button>
          <button type="button" aria-label="Google">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.4a5.5 5.5 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.6-5.2 3.6-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.6V6.7H1.4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.7l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>
          </button>
          <button type="button" aria-label="Apple">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.4 0-2.8.8-3.5 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.6 2.2 2.7 2.2 1.1 0 1.5-.7 2.8-.7 1.3 0 1.6.7 2.7.7 1.1 0 1.9-1.1 2.6-2.1.8-1.2 1.1-2.3 1.1-2.4-.1 0-2.1-.8-2.1-3.3zM14.3 5.9c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1 1.6-.9 2.6 1 .1 2-.5 2.6-1.2z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- success -->
    <div class="done" id="done">
      <div class="inner">
        <svg class="checkmark" viewBox="0 0 52 52" fill="none">
          <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/>
          </linearGradient></defs>
          <circle cx="26" cy="26" r="24" stroke="url(#cg)" stroke-width="2.5"/>
          <path d="m15 27 7.5 7.5L37 19" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3 id="doneTitle">欢迎回来，探险家</h3>
        <p id="doneSub">正在为你打开星海控制台…</p>
        <button class="link" id="resetBtn">← 返回</button>
      </div>
    </div>
  </section>
</main>

<script>
/* ============================================================
   1. Aurora + particle constellation background
   ============================================================ */
(function(){
  const cvs = document.getElementById('bg');
  const ctx = cvs.getContext('2d');
  let W=0, H=0, dpr=1, t=0;
  let parts = [];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mouse = {x:-9999, y:-9999};
  window.addEventListener('pointermove', e => { mouse.x=e.clientX; mouse.y=e.clientY; }, {passive:true});
  window.addEventListener('pointerleave', () => { mouse.x=mouse.y=-9999; });

  const BLOBS = [
    {x:.18, y:.28, r:.62, c:'124,92,255',  s:.00021, p:0},
    {x:.82, y:.24, r:.52, c:'34,211,238',  s:.00017, p:2.1},
    {x:.72, y:.80, r:.60, c:'255,95,162',  s:.00013, p:4.2},
    {x:.28, y:.86, r:.48, c:'59,130,246',  s:.00025, p:1.1},
  ];

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = W*dpr; cvs.height = H*dpr;
    cvs.style.width = W+'px'; cvs.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = reduce ? 0 : Math.min(110, Math.round(W*H/15000));
    parts = Array.from({length:n}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-.5)*.22, vy:(Math.random()-.5)*.22,
      r: Math.random()*1.6+.5, a: Math.random()*.5+.25
    }));
  }

  function draw(){
    t += 16;
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#05060f';
    ctx.fillRect(0,0,W,H);

    // aurora blobs
    ctx.globalCompositeOperation='lighter';
    const m = Math.min(W,H);
    for(const b of BLOBS){
      const x = (b.x + Math.sin(t*b.s + b.p)*.13) * W;
      const y = (b.y + Math.cos(t*b.s*1.27 + b.p)*.11) * H;
      const r = b.r * m * (.85 + Math.sin(t*b.s*1.9 + b.p)*.15);
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,   `rgba(${b.c},.50)`);
      g.addColorStop(.42, `rgba(${b.c},.13)`);
      g.addColorStop(1,   `rgba(${b.c},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
    }

    // particles + constellation
    for(const p of parts){
      p.x += p.vx; p.y += p.vy;
      if(p.x < -20) p.x = W+20; if(p.x > W+20) p.x = -20;
      if(p.y < -20) p.y = H+20; if(p.y > H+20) p.y = -20;

      const dx = p.x-mouse.x, dy = p.y-mouse.y;
      const d2 = dx*dx + dy*dy;
      if(d2 < 22500 && d2 > 0){ // 150px
        const d = Math.sqrt(d2), f = (150-d)/150;
        p.x += (dx/d) * f * 1.9; p.y += (dy/d) * f * 1.9;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = `rgba(210,225,255,${p.a})`;
      ctx.fill();
    }
    ctx.lineWidth = .6;
    for(let i=0;i<parts.length;i++){
      for(let j=i+1;j<parts.length;j++){
        const a=parts[i], b=parts[j];
        const dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
        if(d2 < 12100){ // 110px
          const al = (1 - d2/12100) * .22;
          ctx.strokeStyle = `rgba(150,190,255,${al})`;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }

    // soft cursor halo
    if(mouse.x > -9000){
      const g = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,220);
      g.addColorStop(0,'rgba(124,92,255,.16)');
      g.addColorStop(1,'rgba(124,92,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,220,0,6.2832); ctx.fill();
    }

    ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(draw);
  }

  addEventListener('resize', resize);
  resize(); 
  if(reduce){ drawOnce(); } else { draw(); }

  function drawOnce(){
    ctx.fillStyle='#05060f'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    const m=Math.min(W,H);
    for(const b of BLOBS){
      const g=ctx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,b.r*m);
      g.addColorStop(0,`rgba(${b.c},.5)`); g.addColorStop(1,`rgba(${b.c},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x*W,b.y*H,b.r*m,0,6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
})();


/* ============================================================
   2. Card interactions: tilt + spotlight
   ============================================================ */
(function(){
  const card = document.getElementById('card');
  const spot = document.getElementById('spot');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;

  let raf = null;
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    spot.style.setProperty('--mx', (px*100).toFixed(2)+'%');
    spot.style.setProperty('--my', (py*100).toFixed(2)+'%');
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const ry = (px - .5) * 7;
      const rx = (py - .5) * -7;
      card.style.transform = `perspective(1400px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-4px)`;
    });
  });
  card.addEventListener('pointerleave', () => {
    if(raf) cancelAnimationFrame(raf);
    card.style.transform = 'perspective(1400px) rotateX(0) rotateY(0) translateY(0)';
  });
})();


/* ============================================================
   3. Form: mode switching, validation, submit
   ============================================================ */
(function(){
  const panel   = document.getElementById('panel');
  const form    = document.getElementById('form');
  const fields  = document.getElementById('fields');
  const tabs    = document.getElementById('tabs');
  const pill    = document.getElementById('tabPill');
  const head    = document.getElementById('head');
  const title   = document.getElementById('title');
  const sub     = document.getElementById('subtitle');
  const submit  = document.getElementById('submit');
  const submitTxt = document.getElementById('submitTxt');
  const done    = document.getElementById('done');
  const doneTitle = document.getElementById('doneTitle');
  const doneSub   = document.getElementById('doneSub');

  const COPY = {
    login : {t:'欢迎回来',   s:'登录后继续你的探索之旅',   b:'登 录'},
    signup: {t:'创建账号',   s:'加入我们，开启星海之旅',   b:'注 册'},
    reset : {t:'重置密码',   s:'输入邮箱，我们会发送重置链接', b:'发送链接'}
  };

  let mode = 'login';

  /* --- smooth height of field stack --- */
  function syncHeight(){
    fields.style.height = fields.scrollHeight + 'px';
  }
  addEventListener('resize', syncHeight);

  /* --- move tab pill --- */
  function movePill(){
    const on = tabs.querySelector('.tab.on');
    if(!on) return;
    pill.style.width  = on.offsetWidth + 'px';
    pill.style.left   = on.offsetLeft + 'px';
  }

  function setMode(next){
    if(next === mode) return;
    mode = next;
    // swap headline with fade
    head.classList.add('swap');
    setTimeout(() => {
      title.textContent = COPY[mode].t;
      sub.textContent   = COPY[mode].s;
      submitTxt.textContent = COPY[mode].b;
      head.classList.remove('swap');
    }, 200);

    panel.className = 'panel mode-' + mode;
    tabs.querySelectorAll('.tab').forEach(b => {
      const on = b.dataset.mode === mode || (mode === 'reset' && b.dataset.mode === 'login');
      b.classList.toggle('on', on);
    });
    clearErrors();
    requestAnimationFrame(() => { movePill(); syncHeight(); });
    setTimeout(syncHeight, 480);
  }

  tabs.addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if(b) setMode(b.dataset.mode);
  });
  document.querySelectorAll('.link[data-mode]').forEach(l => {
    l.addEventListener('click', () => setMode(l.dataset.mode));
  });

  /* --- password visibility --- */
  document.querySelectorAll('.eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.toggle);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.4 3.3M6.5 7.8A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 3.6-.7"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    });
  });

  /* --- password strength --- */
  const pass = document.getElementById('pass');
  const bar  = document.getElementById('mbar');
  const mtxt = document.getElementById('mtxt');
  pass.addEventListener('input', () => {
    const v = pass.value;
    let score = 0;
    if(v.length >= 8) score++;
    if(/[A-Za-z]/.test(v) && /\d/.test(v)) score++;
    if(v.length >= 12) score++;
    if(/[^A-Za-z0-9]/.test(v)) score++;
    const pct = [0, 30, 58, 80, 100][score];
    const label = ['弱','一般','不错','很强','极强'][Math.min(score,4)];
    bar.style.width = pct + '%';
    bar.style.background = score <= 1
      ? 'linear-gradient(90deg,#ff5f78,#ff8a5f)'
      : score === 2 ? 'linear-gradient(90deg,#fbbf24,#f59e0b)'
      : 'linear-gradient(90deg,#22d3ee,#7c5cff)';
    mtxt.textContent = v ? '密码强度：' + label : '密码强度：—';
  });

  /* --- validation --- */
  const RE_EMAIL = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
  const FIELD_MAP = { name:'name', email:'email', pass:'pass', pass2:'pass2' };

  function mark(id, bad){
    const el = document.getElementById(id);
    el.closest('.field').classList.toggle('invalid', bad);
  }
  function clearErrors(){
    document.querySelectorAll('.field.invalid').forEach(f => f.classList.remove('invalid'));
  }

  function validate(){
    clearErrors();
    let ok = true, first = null;
    const email = document.getElementById('email');
    const p1 = document.getElementById('pass');
    const p2 = document.getElementById('pass2');
    const name = document.getElementById('name');

    if(!RE_EMAIL.test(email.value.trim())){ mark('email', true); ok=false; first = first||email; }

    if(mode === 'signup'){
      if(name.value.trim().length < 2){ mark('name', true); ok=false; first = first||name; }
      if(!(p1.value.length >= 8 && /[A-Za-z]/.test(p1.value) && /\d/.test(p1.value))){
        mark('pass', true); ok=false; first = first||p1;
      }
      if(p2.value !== p1.value || !p2.value){ mark('pass2', true); ok=false; first = first||p2; }
      if(!document.getElementById('agree').checked){
        ok=false;
        document.querySelector('.row[data-for~="signup"] .box').style.borderColor='rgba(255,95,120,.8)';
      }
    }
    if(mode === 'login'){
      if(p1.value.length < 6){ mark('pass', true); ok=false; first = first||p1; }
    }
    syncHeight();
    if(first) first.focus();
    return ok;
  }

  document.querySelectorAll('#form input').forEach(inp => {
    inp.addEventListener('input', () => {
      const f = inp.closest('.field');
      if(f) f.classList.remove('invalid');
    });
  });

  /* --- ripple + magnetic button --- */
  submit.addEventListener('pointerdown', function(e){
    const r = this.getBoundingClientRect();
    const s = Math.max(r.width, r.height);
    const el = document.createElement('span');
    el.className = 'ripple';
    el.style.width = el.style.height = s + 'px';
    el.style.left = (e.clientX - r.left - s/2) + 'px';
    el.style.top  = (e.clientY - r.top  - s/2) + 'px';
    this.appendChild(el);
    setTimeout(() => el.remove(), 700);
  });

  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    submit.addEventListener('pointermove', e => {
      const r = submit.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width/2)) / r.width;
      const dy = (e.clientY - (r.top + r.height/2)) / r.height;
      submit.style.transform = `translate(${dx*9}px, ${dy*5}px)`;
    });
    submit.addEventListener('pointerleave', () => { submit.style.transform = ''; });
  }

  /* --- submit --- */
  form.addEventListener('submit', e => {
    e.preventDefault();
    if(!validate()) return;

    submit.dataset.state = 'loading';
    setTimeout(() => {
      submit.dataset.state = 'done';
      setTimeout(() => {
        doneTitle.textContent = mode === 'signup' ? '账号创建成功' : mode === 'reset' ? '邮件已发送' : '欢迎回来，探险家';
        doneSub.textContent   = mode === 'reset'
          ? '请查收邮箱，点击链接重置密码'
          : '正在为你打开星海控制台…';
        done.classList.add('show');
        submit.removeAttribute('data-state');
        submit.style.transform = '';
      }, 480);
    }, 1500);
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    done.classList.remove('show');
    form.reset();
    pass.dispatchEvent(new Event('input'));
    bar.style.width = '0';
    mtxt.textContent = '密码强度：—';
    setMode('login');
    requestAnimationFrame(syncHeight);
  });

  /* --- init --- */
  requestAnimationFrame(() => { movePill(); syncHeight(); });
  addEventListener('load', () => { movePill(); syncHeight(); });
  setTimeout(() => { movePill(); syncHeight(); }, 400);
})();
</script>
</body>
</html>
